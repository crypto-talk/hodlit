spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
cryptalk:
  media:
    storage-path: build/test-media
  market-price:
    base-url: http://localhost:9
  jwt:
    secret: test-secret-that-is-definitely-at-least-32-bytes
    access-token-minutes: 15
    refresh-token-days: 14
  cors:
    allowed-origins: http://localhost:3000
  auth:
    cookie-secure: false
