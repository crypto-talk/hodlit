spring:
  application:
    name: cryptalk-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cryptalk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:cryptalk}
    password: ${DB_PASSWORD:cryptalk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

cryptalk:
  admin:
    member-ids: ${ADMIN_MEMBER_IDS:}
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  asset:
    ethereum-rpc-url: ${ETHEREUM_RPC_URL:}
  exchange:
    encryption-key: ${EXCHANGE_CREDENTIAL_ENCRYPTION_KEY:}
    upbit-base-url: https://api.upbit.com
    bithumb-base-url: https://api.bithumb.com
    coinone-base-url: https://api.coinone.co.kr
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  test-pages:
    enabled: ${CRYPTALK_TEST_PAGES_ENABLED:false}
    walletconnect-project-id: ${WALLETCONNECT_PROJECT_ID:}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./uploads}
  market-price:
    base-url: ${MARKET_PRICE_BASE_URL:https://api.coingecko.com/api/v3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
