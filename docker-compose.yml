services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cryptalk}
      MYSQL_USER: ${MYSQL_USER:-cryptalk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - cryptalk-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cryptalk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-cryptalk}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      MARKET_PRICE_BASE_URL: ${MARKET_PRICE_BASE_URL:-https://api.coingecko.com/api/v3}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CRYPTALK_TEST_PAGES_ENABLED: ${CRYPTALK_TEST_PAGES_ENABLED:-false}
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      MEDIA_STORAGE_PATH: /app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - cryptalk-media:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/coins"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

volumes:
  cryptalk-mysql:
  cryptalk-media:

networks:
  internal:
    driver: bridge
