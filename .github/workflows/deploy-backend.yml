name: Deploy backend to Umbrel

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "deploy-backend.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptalk-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Test and deploy backend
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 15
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
      - name: Deploy the triggering commit
        env:
          CRYPTALK_APP_DIRECTORY: /home/umbrel/cryptalk
          CRYPTALK_BRANCH: main
          CRYPTALK_EXPECTED_COMMIT: ${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/deploy-backend.sh"
