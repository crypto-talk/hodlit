# pnpm 공급망 보안 설정 — https://pnpm.io/supply-chain-security
#
# 기본값으로 이미 켜져 있는 것:
#   - 의존성의 설치 스크립트 차단 (pnpm 10~)
#   - minimumReleaseAge 1440분: publish 후 24시간 지난 버전만 설치
#   - 설치 시 락파일을 정책에 대해 재검증

# 설치 스크립트 실행이 실제로 필요한 의존성만 허용한다.
allowBuilds:
  "@reown/appkit": false # postinstall 은 버전 확인 스크립트뿐이라 막아 둔다
  sharp: true # next/image 최적화용 네이티브 바인딩
  unrs-resolver: true # eslint-config-next의 import 해석기

# 하위 의존성이 git 저장소나 tarball URL 등 레지스트리 밖에서 오는 것을 막는다.
blockExoticSubdeps: true

# 패키지의 신뢰 수준이 이전 릴리스보다 낮아지면 설치를 거부한다.
trustPolicy: no-downgrade

# 아래 셋은 next / eslint-config-next / @types/node 가 고정한 하위 의존성이고,
# npm의 서명 체계보다 먼저 배포된 버전이라 정책에 걸린다. 직접 선택한 패키지가 아니다.
#
# 패키지 이름이 아니라 걸린 버전까지 지정한다. 이렇게 두면 예외가 이 버전 하나로 좁혀지고,
# 상위 패키지가 올라가 다른 버전을 물고 오면 설치가 다시 실패해서 검토를 강제한다.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - undici-types@6.21.0
  # 아래 넷은 Reown AppKit · ethers 가 끌고 오는 하위 의존성이다(HODL-55).
  # 넷 다 같은 메인테이너의 앞뒤 버전에는 npm provenance 가 있는데 이 버전에만 없거나(noble · slow-redact),
  # 위 undici-types 처럼 서명 체계 이전 버전이다. 직접 고른 패키지가 아니다.
  - "@noble/curves@1.8.0" # @walletconnect/relay-auth
  - "@noble/hashes@1.7.0" # @noble/curves@1.8.0
  - "slow-redact@0.3.2" # pino ← @walletconnect/logger
  - "undici-types@6.19.8" # @types/node@22.7.5 ← ethers
